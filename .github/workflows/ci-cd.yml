name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install flake8 pytest
        pip install -r requirements.txt

    - name: Lint with flake8
      run: flake8 .

    - name: Run tests
      run: pytest || true

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/noshow-iq-65884:latest .

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/noshow-iq-65884:latest

    - name: Trigger Hugging Face Space Rebuild
      run: |
        curl -X POST \
        -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
        https://huggingface.co/api/spaces/AsifDurrani/noshow-iq/restart
